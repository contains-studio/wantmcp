name: CI

on:
  push:
    # web-formats too: once main is fast-forwarded to a deployed commit, GitHub treats the PR as
    # merged and later pushes to the branch would otherwise get no checks.
    branches: [main, web-formats]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, unit tests and contrast check (every workspace package)
        run: pnpm check
      - name: Build the web app
        run: pnpm build

  # The suite in 6 shards, each on its own runner with its own dev server and fresh mock (Playwright splits by whole
  # files, in name order; desktop and phone tests are spread over all of them). Run whole, it passed 350 tests and hit
  # 15 minutes on 28 Nov 2026. With 4, the second shard held the three slowest files (explorations, looks,
  # review-fixes) and ran about 7 minutes; with 6 the heaviest holds about 4 minutes of tests. A shard's limit still
  # catches a hang.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      # The suite starts the dev server against the in-process mock API (.dev.vars.example).
      - name: End-to-end tests, desktop and phone, with an axe pass
        run: pnpm test:e2e --shard=${{ matrix.shard }}/6
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7
