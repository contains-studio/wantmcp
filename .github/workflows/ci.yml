name: CI

on:
  push:
    # web-formats too: once main is fast-forwarded to a deployed commit, GitHub treats the PR as
    # merged and later pushes to the branch would otherwise get no checks.
    branches: [main, web-formats]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, unit tests and contrast check (every workspace package)
        run: pnpm check
      - name: Build the web app
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the suite passed 350 tests on two screens and hit 15 minutes (cancelled, not failed) on 28 Nov 2026
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      # The suite starts the dev server against the in-process mock API (.dev.vars.example).
      - name: End-to-end tests, desktop and phone, with an axe pass
        run: pnpm test:e2e
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
